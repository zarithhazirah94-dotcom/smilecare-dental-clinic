
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SmileCare Dental Clinic</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Background Image Styling -->
    <style>
        body {
            background-image: url("images/dental-background-picture.avif");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }

        .login-card {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                SmileCare
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="register.html">
                            Register
                        </a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>


    <!-- Login Form -->
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <div class="card shadow border-0 login-card">
                    <div class="card-body p-4">

                        <h2 class="text-center text-primary mb-2">
                            Welcome to SmileCare
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Please log in to continue
                        </p>

                        <!-- Error Message -->
                        <div id="errorMessage"
                            class="alert alert-danger d-none"
                            role="alert">
                        </div>

                        <form id="loginForm">

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email Address
                                </label>

                                <input type="email"
                                    class="form-control"
                                    id="email"
                                    placeholder="Enter your email"
                                    autocomplete="username"
                                    required>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input type="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required>
                            </div>

                            <!-- Login Button -->
                            <button type="submit"
                                class="btn btn-primary w-100">
                                Login
                            </button>

                        </form>

                        <!-- Register Link -->
                        <div class="text-center mt-3">
                            <p class="mb-1">
                                Don't have an account?
                            </p>

                            <a href="register.html"
                                class="text-primary text-decoration-none">
                                Create a new account
                            </a>
                        </div>

                    </div>
                </div>


                <!-- Demo Login Credentials -->
                <div class="card shadow-sm border-0 mt-4 login-card">
                    <div class="card-body p-3">

                        <h6 class="text-primary mb-2">
                            Demo Login Credentials
                        </h6>

                        <!-- Admin Account -->
                        <div class="mb-3">
                            <strong class="text-dark">Admin Account</strong>

                            <p class="small mb-1">
                                Email: admin@smilecare.com
                            </p>

                            <p class="small mb-0">
                                Password: admin123
                            </p>
                        </div>

                        <hr>

                        <!-- Patient Account -->
                        <div>
                            <strong class="text-dark">Patient Account</strong>

                            <p class="small mb-1">
                                Email: patient@gmail.com
                            </p>

                            <p class="small mb-0">
                                Password: patient123
                            </p>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>


    <!-- Bootstrap 5 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Login Validation -->
    <script>
        const loginForm = document.getElementById("loginForm");
        const errorMessage = document.getElementById("errorMessage");

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;

            errorMessage.classList.add("d-none");
            errorMessage.textContent = "";

            // Admin demo account
            if (
                email === "admin@smilecare.com" &&
                password === "admin123"
            ) {
                window.location.href = "admin.html";
            }

            // Patient demo account
            else if (
                email === "patient@gmail.com" &&
                password === "patient123"
            ) {
                window.location.href = "patient-dashboard.html";
            }

            // Incorrect email or password
            else {
                errorMessage.textContent =
                    "Invalid email or password. Please try again.";

                errorMessage.classList.remove("d-none");
            }
        });
    </script>

</body>
</html>
