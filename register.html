
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | SmileCare Dental Clinic</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Background Image Styling -->
    <style>
        body {
            background-image: url("images/dental-background-picture.avif");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }

        .register-card {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                SmileCare
            </a>
        </div>
    </nav>

    <!-- Registration Form -->
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">

                <div class="card shadow register-card">
                    <div class="card-body p-4">

                        <h2 class="text-center text-primary mb-2">
                            Create an Account
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Register as a new patient
                        </p>

                        <form id="registerForm">

                            <!-- Full Name -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label">
                                    Full Name
                                </label>

                                <input type="text" class="form-control"
                                    id="fullName"
                                    placeholder="Enter your full name"
                                    required>
                            </div>

                            <!-- Email Address -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email Address
                                </label>

                                <input type="email" class="form-control"
                                    id="email"
                                    placeholder="Enter your email"
                                    required>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="regPassword" class="form-label">
                                    Password
                                </label>

                                <div class="input-group">
                                    <input type="password" class="form-control"
                                        id="regPassword"
                                        placeholder="Create a password"
                                        required>

                                    <button class="btn btn-outline-secondary"
                                        type="button"
                                        onclick="togglePassword('regPassword', this)">
                                        Show
                                    </button>
                                </div>
                            </div>

                            <!-- Confirm Password -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">
                                    Confirm Password
                                </label>

                                <div class="input-group">
                                    <input type="password" class="form-control"
                                        id="confirmPassword"
                                        placeholder="Re-enter your password"
                                        required>

                                    <button class="btn btn-outline-secondary"
                                        type="button"
                                        onclick="togglePassword('confirmPassword', this)">
                                        Show
                                    </button>
                                </div>
                            </div>

                            <!-- Register Button -->
                            <button type="submit" class="btn btn-primary w-100">
                                Register
                            </button>

                        </form>

                        <!-- Link to Login Page -->
                        <p class="text-center mt-3 mb-0">
                            Already have an account?
                            <a href="index.html" class="text-decoration-none">
                                Login here
                            </a>
                        </p>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Registration Validation -->
    <script>
        const registerForm = document.getElementById("registerForm");

        registerForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const password = document.getElementById("regPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match. Please try again.");
                return;
            }

            alert("Registration successful! You can now log in.");
            window.location.href = "index.html";
        });

        // Show or hide password
        function togglePassword(inputId, button) {
            const passwordInput = document.getElementById(inputId);

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                button.textContent = "Hide";
            } else {
                passwordInput.type = "password";
                button.textContent = "Show";
            }
        }
    </script>

</body>
</html>
